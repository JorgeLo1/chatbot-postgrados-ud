name: Auto-Deploy to Oracle Cloud

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Update and Redeploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Oracle Cloud
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 60m
          script: |
            cd ~/chatbot-postgrados-ud
            
            echo "📥 Pulling latest changes..."
            git pull origin main
            
            echo "🛑 Stopping current container..."
            docker stop chatbot-rasa || true
            docker rm chatbot-rasa || true
            
            echo "🔨 Building new image..."
            docker build -t chatbot-rasa:latest .
            
            echo "🚀 Starting container..."
            docker run -d \
              --name chatbot-rasa \
              --restart unless-stopped \
              -p 5005:5005 \
              -p 5055:5055 \
              -p 5006:5006 \
              --env-file .env \
              chatbot-rasa:latest
            
            echo "✅ Container started. Training runs in background."
            echo "Check progress with: docker logs -f chatbot-rasa"
            docker ps | grep chatbot-rasa
