# Configuration for Rasa NLU.
# https://rasa.com/docs/rasa/nlu/components/

# RECETA: Para producción con NLU mejorado
recipe: default.v1

# LENGUAJE: Español
language: es

# ============================================
# PIPELINE OPTIMIZADO PARA ESPAÑOL
# ============================================
pipeline:
  # Tokenización para español con WhitespaceTokenizer
  - name: WhitespaceTokenizer
  
  # Expresiones regulares para entidades
  - name: RegexFeaturizer
  
  # Extractor de entidades por lookup tables y sinónimos
  - name: LexicalSyntacticFeaturizer
  
  # Contador de n-gramas para mejorar contexto
  - name: CountVectorsFeaturizer
    analyzer: word
    min_ngram: 1
    max_ngram: 3  # Captura frases de hasta 3 palabras
  
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4
  
  # Clasificador DIET con configuración robusta
  - name: DIETClassifier
    epochs: 200  # Aumentado para mejor aprendizaje
    constrain_similarities: true
    model_confidence: softmax
    embedding_dimension: 40  # Aumentado de 20 a 40
    number_of_negative_examples: 50
    # Configuración de pérdidas
    loss_type: cross_entropy
    similarity_type: inner
    # Regularización
    use_sparse_input_dropout: true
    sparse_input_dropout: 0.1
    dense_input_dropout: 0.1
    # Ranking
    ranking_length: 10
    # CRÍTICO: Threshold más alto para mayor precisión
    threshold: 0.3  # Evita intents con baja confianza
  
  # Extractor de entidades CRF (para secuencias)
  - name: EntitySynonymMapper
  
  # Extractor de entidades por expresiones regulares
  - name: RegexEntityExtractor
    case_sensitive: false
  
  # Clasificador de respuestas (para FAQs)
  - name: ResponseSelector
    epochs: 100
    constrain_similarities: true
    retrieval_intent: faq
  
  # Fallback mejorado
  - name: FallbackClassifier
    threshold: 0.6  # Si confianza < 60%, activa fallback
    ambiguity_threshold: 0.1  # Diferencia mínima entre top 2 intents

# ============================================
# POLICIES - OPTIMIZADAS
# ============================================
policies:
  # Memoization para recordar conversaciones exactas
  - name: MemoizationPolicy
    max_history: 5
  
  # RulePolicy para reglas estrictas
  - name: RulePolicy
    core_fallback_threshold: 0.3
    core_fallback_action_name: action_default_fallback
    enable_fallback_prediction: true
  
  # UnexpecTEDIntentPolicy para manejar intents inesperados
  - name: UnexpecTEDIntentPolicy
    max_history: 5
    epochs: 100
    constrain_similarities: true
    model_confidence: softmax
  
  # TEDPolicy - Transformer principal
  - name: TEDPolicy
    max_history: 8  # Aumentado para mejor contexto
    epochs: 150
    constrain_similarities: true
    model_confidence: softmax
    # Configuración de embeddings
    embedding_dimension: 40
    number_of_negative_examples: 50
    # Regularización
    use_sparse_input_dropout: true
    sparse_input_dropout: 0.1
    dense_input_dropout: 0.1
    # Split de validación
    evaluate_on_num_examples: 50
    evaluate_every_number_of_epochs: 20

# ============================================
# CONFIGURACIÓN ASISTENTE
# ============================================
assistant_id: chatbot_postgrados_ud