recipe: default.v1
assistant_id: 20251015-optimizado-postgrados

language: es

pipeline:
  - name: SpacyNLP
    model: "es_core_news_md"
  
  - name: SpacyTokenizer
  
  - name: SpacyFeaturizer
    pooling: "mean"
  
  - name: RegexFeaturizer
  
  - name: LexicalSyntacticFeaturizer
  
  - name: CountVectorsFeaturizer
    analyzer: "char_wb"
    min_ngram: 2
    max_ngram: 4
    OOV_token: "_oov_"
  
  - name: CountVectorsFeaturizer
    analyzer: "word"
    min_ngram: 1
    max_ngram: 2
    OOV_token: "_oov_"
  
  - name: DIETClassifier
    epochs: 400
    constrain_similarities: true
    entity_recognition: true
    use_masked_language_model: true
    BILOU_flag: true
    ranking_length: 10
    transformer_config:
      number_of_transformer_layers: 2
      hidden_size: 256
      attention_heads: 4
      dropout_rate: 0.1
    weight_sparsity: 0.8
    batch_size: [64, 256]
    learning_rate: 0.001
    connection_density: 0.2
    
  - name: CRFEntityExtractor
    BILOU_flag: true
    max_iterations: 50
    L1_c: 0.1
    L2_c: 0.1
  
  - name: EntitySynonymMapper
  
  - name: ResponseSelector
    epochs: 100
    constrain_similarities: true
    retrieval_intent: "faq"
  
  # ✅ FALLBACK CALIBRADO (MEJORADO)
  - name: FallbackClassifier
    threshold: 0.45  # ✅ Bajado de 0.55 a 0.45 (menos fallbacks)
    ambiguity_threshold: 0.10  # ✅ Bajado de 0.15 a 0.10 (más tolerante)

policies:
  - name: RulePolicy
    core_fallback_threshold: 0.3
    core_fallback_action_name: "action_default_fallback"
    enable_fallback_prediction: true
    restrict_rules: false
  
  - name: MemoizationPolicy
    max_history: 8
  
  - name: TEDPolicy
    max_history: 8
    epochs: 150
    constrain_similarities: true
    transformer_config:
      number_of_transformer_layers: 2
      hidden_size: 256
      attention_heads: 4
      dropout_rate: 0.1
    weight_sparsity: 0.8
    batch_size: [32, 128]
    model_confidence: "softmax"
    loss_type: "cross_entropy"
    ranking_length: 10
  
  - name: UnexpecTEDIntentPolicy
    max_history: 5
    epochs: 50
    tolerance: 0.0