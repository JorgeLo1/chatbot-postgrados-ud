# Configuration for Rasa NLU.
# https://rasa.com/docs/rasa/nlu/components/

# RECETA: Para producción con NLU mejorado
recipe: default.v1

# LENGUAJE: Español
language: es

pipeline:
  # Tokenizador spaCy — mejor manejo del español (acentos, morfología)
  - name: SpacyNLP
    model: es_core_news_md
    case_sensitive: false

  - name: SpacyTokenizer

  # Expresiones regulares para entidades
  - name: RegexFeaturizer

  # Features léxico-sintácticas
  - name: LexicalSyntacticFeaturizer

  # Features de spaCy (vectores preentrenados)
  - name: SpacyFeaturizer
    pooling: mean

  # Contador de n-gramas — palabras completas
  - name: CountVectorsFeaturizer
    analyzer: word
    min_ngram: 1
    max_ngram: 3

  # Contador de n-gramas — caracteres (robusto ante errores tipográficos)
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4

  # Clasificador DIET
  - name: DIETClassifier
    epochs: 200
    constrain_similarities: true
    model_confidence: softmax
    embedding_dimension: 40
    number_of_negative_examples: 50
    loss_type: cross_entropy
    similarity_type: inner
    use_sparse_input_dropout: true
    sparse_input_dropout: 0.1
    dense_input_dropout: 0.1
    ranking_length: 10
    # NOTA: threshold no es parámetro de DIET — se controla en FallbackClassifier

  # Mapeo de sinónimos definidos en nlu.yml
  - name: EntitySynonymMapper

  # Extractor de entidades por regex
  - name: RegexEntityExtractor
    case_sensitive: false

  # FallbackClassifier — umbral ajustado para español conversacional
  - name: FallbackClassifier
    threshold: 0.65   # Si confianza < 65%, activa nlu_fallback
    ambiguity_threshold: 0.15

# ============================================
# POLICIES 
# ============================================
policies:
  # MemoizationPolicy — recuerda flujos exactos del entrenamiento
  - name: MemoizationPolicy
    max_history: 5

  # RulePolicy — manejo estricto de reglas
  - name: RulePolicy
    core_fallback_threshold: 0.3
    core_fallback_action_name: action_default_fallback
    enable_fallback_prediction: true

  # UnexpecTEDIntentPolicy — detecta intents fuera de contexto
  - name: UnexpecTEDIntentPolicy
    max_history: 5
    epochs: 100
    constrain_similarities: true
    model_confidence: softmax

  # TEDPolicy — política principal basada en Transformer
  - name: TEDPolicy
    max_history: 8
    epochs: 150
    constrain_similarities: true
    model_confidence: softmax
    embedding_dimension: 40
    number_of_negative_examples: 50
    use_sparse_input_dropout: true
    sparse_input_dropout: 0.1
    dense_input_dropout: 0.1
    # evaluate_on_num_examples: 0 evita error cuando hay pocas stories de validación
    evaluate_on_num_examples: 0
    evaluate_every_number_of_epochs: 20

# ============================================
# CONFIGURACIÓN ASISTENTE
# ============================================
assistant_id: chatbot_postgrados_ud