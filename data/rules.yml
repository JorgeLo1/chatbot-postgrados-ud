version: "3.1"

rules:

# ============================================
# SECCIÓN 1: INICIO Y FIN DE CONVERSACIÓN
# ============================================

- rule: Saludar al usuario
  steps:
  - intent: greet
  - action: action_saludo_mejorado

- rule: Despedirse con goodbye
  steps:
  - intent: goodbye
  - action: action_despedida

- rule: Despedirse cuando dice nada mas
  steps:
  - intent: negate_and_end
  - action: action_despedida

- rule: Agradecer y luego despedirse
  steps:
  - intent: agradecer
  - action: utter_de_nada
  wait_for_user_input: true

- rule: Despedida post-agradecimiento
  steps:
  - intent: agradecer
  - action: utter_de_nada
  - intent: negate_and_end
  - action: action_despedida

- rule: Responder a agradecimiento
  steps:
  - intent: agradecer
  - action: utter_de_nada

# ============================================
# SECCIÓN 2: NAVEGACIÓN Y MENÚ
# ============================================

- rule: Listar postgrados disponibles
  steps:
  - intent: listar_postgrados
  - action: action_listar_postgrados

- rule: Volver al menú principal
  steps:
  - intent: volver_menu
  - action: action_reiniciar_slots
  - action: action_saludo_mejorado
  - action: action_listar_postgrados

- rule: Mostrar opciones de ayuda
  steps:
  - intent: pedir_ayuda
  - action: utter_opciones_ayuda

- rule: Reiniciar conversación completa
  steps:
  - intent: reiniciar
  - action: action_reiniciar_conversacion

# ============================================
# SECCIÓN 3: SELECCIÓN DE POSTGRADO
# ============================================

- rule: Seleccionar postgrado por nombre
  steps:
  - intent: seleccionar_postgrado
  - action: action_seleccionar_postgrado

- rule: Seleccionar postgrado por número
  steps:
  - intent: seleccionar_numero
  - action: action_seleccionar_numero

# ============================================
# SECCIÓN 4: CONSULTAS CON POSTGRADO SELECCIONADO
# ============================================

- rule: Responder consultas específicas con contexto
  condition:
  - slot_was_set:
    - postgrado_id
  steps:
  - or:
    - intent: consultar_costos
    - intent: consultar_requisitos
    - intent: consultar_fechas
    - intent: consultar_duracion
    - intent: consultar_modalidad
    - intent: consultar_becas
    - intent: consultar_financiacion
    - intent: consultar_plan_estudios
    - intent: solicitar_link_inscripcion
    - intent: consultar_dirigido
    - intent: consultar_proceso_admision
  - action: action_buscar_faq

- rule: Información general con postgrado seleccionado
  condition:
  - slot_was_set:
    - postgrado_id
  steps:
  - intent: solicitar_informacion_general
  - action: action_manejar_pregunta_general

- rule: Pregunta libre sobre postgrado seleccionado
  condition:
  - slot_was_set:
    - postgrado_id
  steps:
  - intent: pregunta_postgrado
  - action: action_buscar_faq_libre

# ============================================
# SECCIÓN 5: CONSULTAS SIN POSTGRADO SELECCIONADO
# ============================================

- rule: Consulta sin contexto - solicitar selección
  condition:
  - slot_was_set:
    - postgrado_id: null
  steps:
  - or:
    - intent: consultar_costos
    - intent: consultar_requisitos
    - intent: consultar_fechas
    - intent: consultar_duracion
    - intent: consultar_modalidad
    - intent: consultar_becas
    - intent: consultar_financiacion
    - intent: consultar_plan_estudios
    - intent: solicitar_link_inscripcion
    - intent: consultar_dirigido
    - intent: consultar_proceso_admision
  - action: utter_ask_cual_programa
  - action: action_listar_postgrados
  wait_for_user_input: true

- rule: Información general sin contexto
  condition:
  - slot_was_set:
    - postgrado_id: null
  steps:
  - intent: solicitar_informacion_general
  - action: utter_informacion_general_universidad
  - action: action_listar_postgrados

# ============================================
# SECCIÓN 6: FORMULARIO DE CONTACTO
# ============================================

- rule: Iniciar contacto con asesor
  steps:
  - intent: contactar_asesor
  - action: datos_contacto_form
  - active_loop: datos_contacto_form

- rule: Enviar datos cuando formulario completo
  condition:
  - active_loop: datos_contacto_form
  steps:
  - action: datos_contacto_form
  - active_loop: null
  - slot_was_set:
    - requested_slot: null
  - action: action_enviar_datos_contacto

- rule: Cancelar formulario explícitamente
  condition:
  - active_loop: datos_contacto_form
  steps:
  - or:
    - intent: deny
    - intent: volver_menu
  - action: action_deactivate_loop
  - active_loop: null
  - action: utter_formulario_cancelado
  - action: utter_opciones_ayuda

- rule: Responder preguntas durante formulario
  condition:
  - active_loop: datos_contacto_form
  steps:
  - intent: pedir_ayuda
  - action: utter_ayuda_durante_formulario
  - action: datos_contacto_form

# ============================================
# SECCIÓN 7: MANEJO DE ERRORES Y FALLBACKS
# ============================================

- rule: Responder preguntas fuera de alcance
  steps:
  - intent: out_of_scope
  - action: utter_out_of_scope

- rule: Manejo de afirmación
  steps:
  - intent: affirm
  - action: action_manejar_afirmacion

# ============================================
# SECCIÓN 8: RESPUESTAS EMOCIONALES
# ============================================

- rule: Responder a emoción positiva
  steps:
  - intent: mood_great
  - action: utter_happy

- rule: Responder a emoción negativa
  steps:
  - intent: mood_unhappy
  - action: utter_cheer_up
  - action: utter_opciones_ayuda

# ============================================
# SECCIÓN 9: METAPREGUNTAS Y BOT CHALLENGE
# ============================================

- rule: Responder si es un bot
  steps:
  - intent: bot_challenge
  - action: utter_iamabot